version: "3.9"

# ============================================================
# Helio — Production Docker Compose
# ============================================================
# Usage:
#   cp .env.example .env  # Edit JWT_SECRET and other values
#   docker compose -f docker-compose.prod.yml up -d
#
# Runs behind a reverse proxy (see nginx/helio.conf). Uncomment the
# nginx service below or point your existing proxy at helio:3001.
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  helio:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        UID: 1001
        GID: 1001
    image: helio:latest
    # Only reachable from the proxy network — reverse proxy handles external traffic
    expose:
      - "3001"
    volumes:
      - helio-data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — generate with: openssl rand -hex 64}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://helio.example.com}
      - RETENTION_RAW_DAYS=${RETENTION_RAW_DAYS:-7}
      - NTFY_DEFAULT_SERVER=${NTFY_DEFAULT_SERVER:-https://ntfy.sh}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Berlin}
      # Behind exactly one reverse proxy → real client IPs for rate limiting
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - NOTIFICATION_ALLOW_PRIVATE=${NOTIFICATION_ALLOW_PRIVATE:-false}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    restart: unless-stopped
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/v1/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647   # unprivileged ICMP ping
    logging: *default-logging

  # Optional: Nginx reverse proxy with SSL
  # Uncomment and configure nginx/helio.conf for production use
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/helio.conf:/etc/nginx/conf.d/helio.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - ./nginx/www:/var/www/html:ro
  #   depends_on:
  #     - helio
  #   restart: unless-stopped
  #   logging: *default-logging

volumes:
  helio-data:
