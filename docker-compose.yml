# Helio — quick start
#   docker compose up -d   →  http://localhost:3001
# The first visit asks you to create the admin account.
services:
  helio:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: helio:latest
    container_name: helio
    ports:
      - "3001:3001"
    volumes:
      - helio-data:/app/data
    environment:
      # Optional: set a fixed secret (otherwise one is generated in the data volume)
      - JWT_SECRET=${JWT_SECRET:-}
      - TZ=${TZ:-Europe/Berlin}
      - RETENTION_RAW_DAYS=${RETENTION_RAW_DAYS:-7}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      # Allow webhooks/ntfy targets in your LAN (e.g. self-hosted ntfy)
      - NOTIFICATION_ALLOW_PRIVATE=${NOTIFICATION_ALLOW_PRIVATE:-true}
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    restart: unless-stopped

volumes:
  helio-data:
